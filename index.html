<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Guide · Latino Built</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="enhance.css?v=6"></head><body><header><div class="mark">LB</div><div><h1 id="title">Field Guide</h1><small id="provided">Provided by Latino Built</small></div><button id="language" onclick="toggleLanguage()" aria-label="Change language">Español</button></header><main id="content"></main><nav aria-label="Field Guide"><button id="nav-identify" onclick="setTab('identify')">Identify</button><button id="nav-vocabulary" onclick="setTab('vocabulary')">Vocabulary</button><button id="nav-practice" onclick="setTab('practice')">Practice</button></nav><script>const DATA={"areas": [{"name": ["Heating & cooling", "Calefacción y aire acondicionado"], "items": [{"name": ["Heat pump", "Bomba de calor"], "clues": ["Outdoor unit plus indoor air handler; the label identifies the model. Thermostat settings alone do not confirm equipment type.", "Unidad exterior y manejadora interior; la placa identifica el modelo. El termostato por sí solo no confirma el tipo."]}, {"name": ["Furnace", "Horno de calefacción"], "clues": ["Look for an equipment label and visible fuel connection or electric rating. Record fuel type only when confirmed.", "Busque la placa y una conexión visible de combustible o potencia eléctrica. Anote el combustible solo si está confirmado."]}, {"name": ["Ductless mini-split", "Minisplit sin ductos"], "clues": ["Wall or ceiling indoor heads connected to an outdoor unit. Record each head and outdoor model.", "Unidades interiores de pared o techo conectadas a una unidad exterior. Anote cada unidad y el modelo exterior."]}]}, {"name": ["Water heating", "Calentamiento de agua"], "items": [{"name": ["Tank water heater", "Calentador de agua con tanque"], "clues": ["Storage tank with hot/cold water connections. Record capacity, fuel, model and visible leaks.", "Tanque con conexiones de agua caliente y fría. Anote capacidad, combustible, modelo y fugas visibles."]}, {"name": ["Tankless water heater", "Calentador de agua sin tanque"], "clues": ["Compact unit with water connections. Confirm fuel and model from its label.", "Unidad compacta con conexiones de agua. Confirme combustible y modelo en la placa."]}, {"name": ["Heat pump water heater", "Calentador de agua con bomba de calor"], "clues": ["Storage tank with a fan or heat-pump assembly above it. Confirm the label; note clearance and condensate drain.", "Tanque con ventilador o bomba de calor encima. Confirme la placa; anote espacio libre y drenaje de condensado."]}]}, {"name": ["Electrical", "Electricidad"], "items": [{"name": ["Electrical panel", "Panel eléctrico"], "clues": ["Record the exterior label, visible condition and accessible location. Do not remove the cover or touch wiring.", "Anote la placa exterior, condición visible y ubicación accesible. No quite la tapa ni toque cables."]}, {"name": ["Outlet / receptacle", "Tomacorriente"], "clues": ["Record location and visible cracks, discoloration or missing covers. Appearance does not prove correct wiring.", "Anote ubicación, grietas, decoloración o tapas faltantes. La apariencia no confirma un cableado correcto."]}, {"name": ["GFCI outlet", "Tomacorriente GFCI"], "clues": ["TEST/RESET buttons are a visible clue. Record the label; a qualified person should verify protection.", "Los botones TEST/RESET son una pista visible. Anote la etiqueta; una persona calificada debe verificar la protección."]}]}, {"name": ["Plumbing", "Plomería"], "items": [{"name": ["Supply piping", "Tubería de suministro"], "clues": ["Record visible material, approximate size and leaks. Color alone does not establish pipe material.", "Anote material visible, tamaño aproximado y fugas. El color por sí solo no identifica el material."]}, {"name": ["Drain piping", "Tubería de desagüe"], "clues": ["Record accessible drain and trap locations, material and visible leakage.", "Anote ubicación de desagües y trampas accesibles, material y fugas visibles."]}, {"name": ["Shutoff valve", "Válvula de cierre"], "clues": ["Record its location and which fixture it appears to serve. Do not operate an unfamiliar or damaged valve.", "Anote ubicación y el aparato que parece servir. No opere una válvula desconocida o dañada."]}]}, {"name": ["Insulation", "Aislamiento"], "items": [{"name": ["Batt insulation", "Aislamiento en mantas"], "clues": ["Precut blankets between framing. Record visible thickness, gaps and location without disturbing material.", "Mantas precortadas entre elementos estructurales. Anote grosor visible, huecos y ubicación sin mover el material."]}, {"name": ["Loose-fill insulation", "Aislamiento suelto"], "clues": ["Loose fibers or granules. Record accessible depth and coverage; appearance cannot establish composition or safety.", "Fibras o gránulos sueltos. Anote profundidad accesible y cobertura; la apariencia no confirma composición ni seguridad."]}, {"name": ["Rigid foam", "Espuma rígida"], "clues": ["Board insulation. Record visible markings, thickness, location and uncovered gaps.", "Paneles de aislamiento. Anote marcas visibles, grosor, ubicación y huecos sin cubrir."]}]}, {"name": ["Windows & doors", "Ventanas y puertas"], "items": [{"name": ["Window", "Ventana"], "clues": ["Record frame material, operability, visible glazing layers, condensation and approximate opening size.", "Anote material del marco, funcionamiento, capas visibles de vidrio, condensación y tamaño aproximado."]}, {"name": ["Exterior door", "Puerta exterior"], "clues": ["Record door material, threshold, visible gaps and weatherstripping condition.", "Anote material, umbral, huecos visibles y condición del burlete."]}, {"name": ["Weatherstripping", "Burlete"], "clues": ["Flexible seals along moving window or door edges. Record missing, loose or damaged sections.", "Sellos flexibles en los bordes móviles de puertas o ventanas. Anote partes faltantes, sueltas o dañadas."]}]}, {"name": ["Ventilation", "Ventilación"], "items": [{"name": ["Bathroom exhaust fan", "Extractor de baño"], "clues": ["Ceiling or wall grille with fan. Record location and visible condition; a grille does not confirm outdoor discharge.", "Rejilla de techo o pared con ventilador. Anote ubicación y condición; la rejilla no confirma salida al exterior."]}, {"name": ["Range hood", "Campana extractora"], "clues": ["Hood over cooking equipment. Record model and whether visible ducting is present; do not assume it vents outdoors.", "Campana sobre la cocina. Anote modelo y ductos visibles; no suponga que descarga al exterior."]}, {"name": ["HRV / ERV", "HRV / ERV"], "clues": ["Labeled ventilation unit with multiple ducts. Confirm the model and record accessible filters and location.", "Unidad de ventilación identificada con varios ductos. Confirme modelo y anote filtros accesibles y ubicación."]}]}, {"name": ["Moisture & home condition", "Humedad y condición de la vivienda"], "items": [{"name": ["Water staining", "Manchas de agua"], "clues": ["Record location, size and whether the area appears wet. A stain alone does not identify the source.", "Anote ubicación, tamaño y si parece estar mojada. Una mancha no identifica por sí sola el origen."]}, {"name": ["Condensation", "Condensación"], "clues": ["Visible droplets on glass or surfaces. Record location and conditions; repeated moisture needs evaluation.", "Gotas visibles en vidrio o superficies. Anote ubicación y condiciones; la humedad repetida requiere evaluación."]}, {"name": ["Suspected mold", "Posible moho"], "clues": ["Record visible discoloration without disturbing it. Appearance cannot confirm mold type or health risk.", "Anote decoloración visible sin moverla. La apariencia no confirma el tipo de moho ni el riesgo para la salud."]}]}], "words": [{"en": "Estimate", "es": "Presupuesto", "cat": "Job"}, {"en": "Invoice", "es": "Factura", "cat": "Job"}, {"en": "Deposit", "es": "Anticipo", "cat": "Job"}, {"en": "Labor", "es": "Mano de obra", "cat": "Job"}, {"en": "Materials", "es": "Materiales", "cat": "Job"}, {"en": "Permit", "es": "Permiso", "cat": "Job"}, {"en": "Inspection", "es": "Inspección", "cat": "Job"}, {"en": "Scope of work", "es": "Alcance del trabajo", "cat": "Job"}, {"en": "Measurement", "es": "Medida", "cat": "Job"}, {"en": "Square feet", "es": "Pies cuadrados", "cat": "Job"}, {"en": "Length", "es": "Largo", "cat": "Job"}, {"en": "Width", "es": "Ancho", "cat": "Job"}, {"en": "Height", "es": "Altura", "cat": "Job"}, {"en": "Access", "es": "Acceso", "cat": "Job"}, {"en": "Homeowner", "es": "Propietario de la vivienda", "cat": "Job"}, {"en": "Heat pump", "es": "Bomba de calor", "cat": "HVAC"}, {"en": "Furnace", "es": "Horno de calefacción", "cat": "HVAC"}, {"en": "Air conditioner", "es": "Aire acondicionado", "cat": "HVAC"}, {"en": "Thermostat", "es": "Termostato", "cat": "HVAC"}, {"en": "Air filter", "es": "Filtro de aire", "cat": "HVAC"}, {"en": "Duct", "es": "Ducto", "cat": "HVAC"}, {"en": "Return air", "es": "Aire de retorno", "cat": "HVAC"}, {"en": "Supply air", "es": "Aire de suministro", "cat": "HVAC"}, {"en": "Refrigerant", "es": "Refrigerante", "cat": "HVAC"}, {"en": "Water heater", "es": "Calentador de agua", "cat": "Plumbing"}, {"en": "Shutoff valve", "es": "Válvula de cierre", "cat": "Plumbing"}, {"en": "Drain", "es": "Desagüe", "cat": "Plumbing"}, {"en": "Leak", "es": "Fuga", "cat": "Plumbing"}, {"en": "Faucet", "es": "Grifo / llave", "cat": "Plumbing"}, {"en": "Pipe", "es": "Tubería", "cat": "Plumbing"}, {"en": "Trap", "es": "Trampa de desagüe", "cat": "Plumbing"}, {"en": "Hot water", "es": "Agua caliente", "cat": "Plumbing"}, {"en": "Cold water", "es": "Agua fría", "cat": "Plumbing"}, {"en": "Electrical panel", "es": "Panel eléctrico", "cat": "Electrical"}, {"en": "Circuit breaker", "es": "Interruptor automático / disyuntor", "cat": "Electrical"}, {"en": "Outlet", "es": "Tomacorriente", "cat": "Electrical"}, {"en": "Grounding", "es": "Puesta a tierra", "cat": "Electrical"}, {"en": "Wiring", "es": "Cableado", "cat": "Electrical"}, {"en": "Voltage", "es": "Voltaje", "cat": "Electrical"}, {"en": "Insulation", "es": "Aislamiento", "cat": "Envelope"}, {"en": "Attic", "es": "Ático", "cat": "Envelope"}, {"en": "Crawl space", "es": "Espacio de acceso debajo de la casa", "cat": "Envelope"}, {"en": "Window", "es": "Ventana", "cat": "Envelope"}, {"en": "Door", "es": "Puerta", "cat": "Envelope"}, {"en": "Weatherstripping", "es": "Burlete", "cat": "Envelope"}, {"en": "Air sealing", "es": "Sellado de fugas de aire", "cat": "Envelope"}, {"en": "Ceiling", "es": "Techo interior", "cat": "Envelope"}, {"en": "Roof", "es": "Techo exterior / cubierta", "cat": "Envelope"}, {"en": "Wall", "es": "Pared", "cat": "Envelope"}, {"en": "Foundation", "es": "Cimentación", "cat": "Envelope"}, {"en": "Ventilation", "es": "Ventilación", "cat": "Ventilation"}, {"en": "Exhaust fan", "es": "Extractor de aire", "cat": "Ventilation"}, {"en": "Range hood", "es": "Campana extractora", "cat": "Ventilation"}, {"en": "Moisture", "es": "Humedad", "cat": "Condition"}, {"en": "Condensation", "es": "Condensación", "cat": "Condition"}, {"en": "Water stain", "es": "Mancha de agua", "cat": "Condition"}, {"en": "Damage", "es": "Daño", "cat": "Condition"}, {"en": "Clearance", "es": "Espacio libre", "cat": "Job"}], "phrases": [{"en": "Where is the electrical panel?", "es": "¿Dónde está el panel eléctrico?", "cat": "Phrases"}, {"en": "May I take a photo of the equipment label?", "es": "¿Puedo tomar una foto de la placa del equipo?", "cat": "Phrases"}, {"en": "Is there access to the attic?", "es": "¿Hay acceso al ático?", "cat": "Phrases"}, {"en": "Have you noticed any water leaks?", "es": "¿Ha notado alguna fuga de agua?", "cat": "Phrases"}, {"en": "When did this problem start?", "es": "¿Cuándo empezó este problema?", "cat": "Phrases"}, {"en": "I need to verify the model number.", "es": "Necesito verificar el número de modelo.", "cat": "Phrases"}, {"en": "This estimate includes labor and materials.", "es": "Este presupuesto incluye mano de obra y materiales.", "cat": "Phrases"}, {"en": "A qualified specialist needs to evaluate this.", "es": "Un especialista calificado necesita evaluar esto.", "cat": "Phrases"}, {"en": "Please keep this area clear.", "es": "Por favor, mantenga esta área despejada.", "cat": "Phrases"}, {"en": "We will review the scope before starting.", "es": "Revisaremos el alcance antes de empezar.", "cat": "Phrases"}]};
let lang=0,tab='identify',area=-1,kind='words',filter='',search='',quizIndex=0,answered=false,score=0;
const quiz=[{q:['What does “burlete” mean?','¿Qué significa “weatherstripping”?'],options:[['Weatherstripping','Burlete'],['Water heater','Calentador de agua'],['Circuit breaker','Disyuntor']],correct:0,why:['Weatherstripping seals the moving edges of windows and doors.','El burlete sella los bordes móviles de ventanas y puertas.']},{q:['What is the best source for an equipment model?','¿Dónde se confirma el modelo de un equipo?'],options:[['Its color','Su color'],['The equipment label','La placa del equipo'],['The thermostat setting','El ajuste del termostato']],correct:1,why:['Record the model from the equipment label; appearance alone is not enough.','Anote el modelo de la placa; la apariencia no basta.']},{q:['How do you say “shutoff valve” in Spanish?','¿Cómo se dice “válvula de cierre” en inglés?'],options:[['Desagüe / drain','Drain'],['Filtro / filter','Filter'],['Válvula de cierre / shutoff valve','Shutoff valve']],correct:2,why:['A shutoff valve controls water to a fixture or supply line.','La válvula de cierre controla el agua de un aparato o suministro.']},{q:['Does a water stain prove where a leak started?','¿Una mancha de agua confirma el origen de una fuga?'],options:[['Yes','Sí'],['No; record it and arrange evaluation','No; documéntela y solicite evaluación']],correct:1,why:['Visible staining is a clue, not a confirmed diagnosis.','Una mancha visible es una pista, no un diagnóstico confirmado.']},{q:['What does “mano de obra” mean?','¿Qué significa “labor” en un presupuesto?'],options:[['Materials','Materiales'],['Labor','Mano de obra'],['Deposit','Anticipo']],correct:1,why:['Labor is the work required to complete the job.','La mano de obra es el trabajo necesario para realizar el proyecto.']},{q:['What can you safely record about an electrical panel?','¿Qué puede documentar de un panel eléctrico?'],options:[['Exterior label and visible condition','Placa exterior y condición visible'],['Wiring behind the removed cover','Cables después de quitar la tapa']],correct:0,why:['Keep the cover in place. Electrical evaluation belongs to a qualified specialist.','Mantenga la tapa puesta. La evaluación eléctrica corresponde a un especialista calificado.']}];
const el=id=>document.getElementById(id),t=(en,es)=>lang?es:en,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function matchingWords(query,category,collection=kind){return DATA[collection].filter(w=>(!category||w.cat===category)&&normalize(w.en+' '+w.es).includes(normalize(query)))}
function toggleLanguage(){lang=1-lang;try{localStorage.setItem('lb-guide-language',String(lang))}catch(e){}render()}
function setTab(next){tab=next;render()}
function chooseArea(i){area=i;render()}
function render(){document.documentElement.lang=lang?'es':'en';el('title').textContent=t('Field Guide','Guía de Campo');el('provided').textContent=t('Provided by Latino Built','Proporcionado por Latino Built');el('language').textContent=lang?'English':'Español';['identify','vocabulary','practice'].forEach((v,i)=>{el('nav-'+v).textContent=[['Identify','Identificar'],['Vocabulary','Vocabulario'],['Practice','Practicar']][i][lang];el('nav-'+v).setAttribute('aria-current',tab===v?'page':'false')});if(tab==='identify')renderIdentify();if(tab==='vocabulary')renderVocabulary();if(tab==='practice')renderPractice()}
function renderIdentify(){el('content').innerHTML=area<0?`<h2>${t('What are you looking at?','¿Qué está observando?')}</h2><p>${t('Choose an area of the home. Use visible clues and confirm equipment labels.','Elija un área de la vivienda. Use pistas visibles y confirme las placas del equipo.')}</p><div class="grid">${DATA.areas.map((a,i)=>`<button class="card choice" onclick="chooseArea(${i})">${esc(a.name[lang])}<span>${a.items.length} ${t('field references','referencias de campo')} →</span></button>`).join('')}</div>`:`<button class="back" onclick="chooseArea(-1)">← ${t('All home areas','Todas las áreas')}</button><h2>${esc(DATA.areas[area].name[lang])}</h2><p>${t('Visible clues help you describe what you see. They do not confirm performance or safety.','Las pistas visibles ayudan a describir lo observado. No confirman funcionamiento ni seguridad.')}</p>${DATA.areas[area].items.map(a=>`<article class="card"><h3>${esc(a.name[lang])}</h3><div class="translation">${esc(a.name[1-lang])}</div><p>${esc(a.clues[lang])}</p><strong>${t('Record in the field','Documente en campo')}</strong><p>${t('Location · label/model · measurements · visible condition · photo with permission','Ubicación · placa/modelo · medidas · condición visible · foto con permiso')}</p></article>`).join('')}`}
function renderVocabulary(){el('content').innerHTML=`<h2>${t('Words for the field','Palabras para el campo')}</h2><p>${t('English and Spanish, side by side. Regional terms may vary.','Inglés y español, lado a lado. Los términos pueden variar según la región.')}</p><div class="controls"><button aria-pressed="${kind==='words'}" onclick="changeKind('words')">${t('Words','Palabras')}</button><button aria-pressed="${kind==='phrases'}" onclick="changeKind('phrases')">${t('Useful phrases','Frases útiles')}</button></div><label for="search">${t('Search either language','Buscar en ambos idiomas')}</label><input id="search" type="search" value="${esc(search)}" placeholder="${t('Try: valve, attic, fuga…','Ejemplo: valve, ático, fuga…')}" oninput="search=this.value;renderWordList()"><label for="category">${t('Category','Categoría')}</label><select id="category" onchange="filter=this.value;renderWordList()"><option value="">${t('All categories','Todas las categorías')}</option>${[...new Set(DATA[kind].map(w=>w.cat))].map(c=>`<option value="${c}" ${filter===c?'selected':''}>${({Job:['Job & measurements','Trabajo y medidas'],HVAC:['Heating & cooling','Calefacción y aire'],Plumbing:['Plumbing','Plomería'],Electrical:['Electrical','Electricidad'],Envelope:['Home exterior & insulation','Envolvente y aislamiento'],Ventilation:['Ventilation','Ventilación'],Condition:['Home condition','Condición de vivienda'],Phrases:['Useful phrases','Frases útiles']}[c])[lang]}</option>`).join('')}</select><div id="word-count" role="status"></div><div id="word-list"></div>`;renderWordList()}
function changeKind(v){kind=v;filter='';renderVocabulary()}
function renderWordList(){const rows=matchingWords(search,filter);el('word-count').textContent=rows.length+' '+t('results','resultados');el('word-list').innerHTML=rows.length?rows.map(w=>`<article class="card word"><div lang="en"><small>ENGLISH</small><h3>${esc(w.en)}</h3></div><div lang="es"><small>ESPAÑOL</small><h3>${esc(w.es)}</h3></div></article>`).join(''):`<p>${t('No matches. Try another word or choose all categories.','Sin resultados. Pruebe otra palabra o todas las categorías.')}</p>`}
function renderPractice(){if(quizIndex>=quiz.length){el('content').innerHTML=`<h2>${t('Practice complete','Práctica completada')}</h2><article class="card"><h3>${score} / ${quiz.length}</h3><p>${t('Use these references to keep learning. This practice is not a certification.','Use estas referencias para seguir aprendiendo. Esta práctica no es una certificación.')}</p><button class="primary" onclick="restartQuiz()">${t('Practice again','Practicar de nuevo')}</button></article>`;return}const q=quiz[quizIndex];el('content').innerHTML=`<h2>${t('Quick field practice','Práctica rápida de campo')}</h2><p>${t('Question','Pregunta')} ${quizIndex+1} / ${quiz.length}</p><article class="card"><h3>${esc(q.q[lang])}</h3><div class="answers">${q.options.map((o,i)=>`<button ${answered?'disabled':''} onclick="answerQuiz(${i})">${esc(o[lang])}</button>`).join('')}</div><div id="feedback" role="status">${answered?esc(q.why[lang]):''}</div><button class="primary" id="next" ${answered?'':'disabled'} onclick="nextQuiz()">${t('Next','Siguiente')} →</button></article>`}
function answerQuiz(i){if(answered||quizIndex>=quiz.length)return;answered=true;const correct=i===quiz[quizIndex].correct;if(correct)score++;renderPractice();el('feedback').textContent=t(correct?'Correct. ':'Keep learning. ',correct?'Correcto. ':'Siga aprendiendo. ')+quiz[quizIndex].why[lang]}
function nextQuiz(){if(!answered)return;quizIndex++;answered=false;renderPractice()}
function restartQuiz(){quizIndex=0;score=0;answered=false;renderPractice()}
try{lang=localStorage.getItem('lb-guide-language')==='1'?1:0}catch(e){}render();</script><script src="enhance.js?v=6"></script></body></html>
